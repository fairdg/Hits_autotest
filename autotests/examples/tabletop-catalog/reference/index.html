<!-- Правильный вариант -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Кубикаталог — настольные игры</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f7f4ee; color: #2b2b2b; }
    h1 { font-size: 24px; }
    #catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
    .game-card { background: #fff; border: 1px solid #d8d2c8; border-radius: 8px; padding: 12px; }
    .game-img { width: 64px; height: 64px; image-rendering: pixelated; background: #efe9df; border-radius: 4px; }
    .game-name { font-size: 16px; margin: 10px 0 4px; }
    .game-desc { font-size: 13px; color: #555; margin: 4px 0; }
    .game-price { font-weight: 700; margin: 10px 0 0; }
    .pager { margin-top: 20px; display: flex; gap: 12px; align-items: center; }
    .pager-btn { padding: 6px 14px; font-size: 14px; cursor: pointer; }
    .pager-btn:disabled { color: #aaa; cursor: default; }
    .page-indicator { font-size: 14px; min-width: 110px; text-align: center; }
  </style>
</head>
<body>

  <main id="catalog"></main>

    <span id="page-indicator" class="page-indicator"></span>
    <button id="next" class="pager-btn" onclick="showPage(currentPage + 1)">Далее →</button>
  </nav>

    const PER_PAGE = 5;
    const TOTAL_PAGES = Math.ceil(GAMES.length / PER_PAGE);
    let currentPage = 1;

    function cardTemplate(g) {
      return `<article class="game-card">
        <img class="game-img" src="${g.img}" alt="${g.name}">
        <h2 class="game-name">${g.name}</h2>
        <p class="game-desc">${g.desc}</p>
        <p class="game-price">${g.price} ₽</p>
      </article>`;
    }

    function render() {
      const start = (currentPage - 1) * PER_PAGE;
      const items = GAMES.slice(start, start + PER_PAGE);
      document.getElementById("catalog").innerHTML = items.map(cardTemplate).join("");
      document.getElementById("page-indicator").textContent =
        "Страница " + currentPage + " из " + TOTAL_PAGES;
      document.getElementById("prev").disabled = currentPage === 1;
      document.getElementById("next").disabled = currentPage === TOTAL_PAGES;
    }

    function showPage(n) {
      currentPage = Math.min(Math.max(1, n), TOTAL_PAGES);
      render();
    }

    render();
  </script>
